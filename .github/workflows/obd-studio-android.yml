name: Build OBD Studio debug APK
on:
  push:
    branches:
      - feature/obd-studio-android-v0-1
    paths:
      - 'OBDStudio/**'
      - '.github/workflows/obd-studio-android.yml'
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: yes | sdkmanager --licenses || true
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test and build
        run: gradle -p OBDStudio :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: OBDStudio-debug-apk
          path: OBDStudio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
